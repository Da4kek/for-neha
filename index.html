<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>For Neha 💌</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="floaties" id="floaties" aria-hidden="true"></div>

  <!-- Screen 1: landing -->
  <main class="screen active" id="s-landing">
    <p class="small">psst… this is for</p>
    <h1 class="script">Neha Mari</h1>
    <button class="envelope" id="openBtn" aria-label="Tap to open">
      <span class="env-back"></span>
      <span class="env-flap"></span>
      <span class="env-heart">💖</span>
    </button>
    <p class="hint">tap to open ✨</p>
  </main>

  <!-- Screen 2: sorry + consent -->
  <main class="screen" id="s-message">
    <div class="card">
      <p class="sorry" id="sorry">Sorry I annoy you so much 🥺</p>
      <p class="sorry sub" id="sub">(it will happen a lot)</p>
      <div class="consent" id="consent" hidden>
        <p class="typed" id="typed" aria-live="polite"></p>
        <div class="choices" id="choices" hidden>
          <button class="btn yes" data-choice="yes">Yes 🙂</button>
          <button class="btn heck" data-choice="heck">Hell yeah 😎🔥</button>
        </div>
      </div>
    </div>
  </main>

  <!-- Screen 3: treat -->
  <main class="screen" id="s-treat">
    <div class="card wide">
      <h2 class="script" id="treatTitle">Yay! 🎉</h2>
      <p class="treat-text">Since you said yeah, here's a virtual <b>Pongal</b> and <b>Banana Fry</b> 💛</p>
      <div class="food">
        <figure>
          <img src="images/pongal.svg" alt="A warm bowl of Pongal with ghee and cashews">
          <figcaption>Pongal</figcaption>
        </figure>
        <figure>
          <img src="images/banana-fry.svg" alt="Golden crispy banana fry">
          <figcaption>Banana Fry</figcaption>
        </figure>
      </div>
      <p class="small">made with love (and a little annoyance) 🫶</p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
